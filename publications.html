        }

        .section-title {

            font-size: 30px;
            text-align: center;

            margin: 50px 0 30px 0;
            padding-bottom: 12px;

            border-bottom: 2px solid #999999;
        }

            margin-bottom: 30px;
        }

        #all-publications {
           max-height: 900px;
           overflow-y: auto;

        }

        .publication-button {
            display: block;
            width: 100%;

            background: #B8D8C0;
            color: black;

            text-decoration: none;
            font-size: 20px;
            font-weight: bold;

            padding: 18px 25px;
            border-radius: 12px;

            box-shadow: 0 4px 7px rgba(0,0,0,0.20);

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
        }

        .publication-button:hover {
            background: #8FBEA1;
            transform: translateY(-3px);
            box-shadow: 0 7px 11px rgba(0,0,0,0.22);
        }

        .authors {
            margin: 10px 10px 0 10px;
            font-size: 15px;
            line-height: 1.5;
        }

        .journal {
            margin: 4px 10px 0 10px;
            font-size: 14px;
            font-style: italic;
        }


        /* ---------- MEMBER SECTIONS ---------- */

        .member {
            margin-bottom: 18px;
        }

        .member summary {
            cursor: pointer;

            list-style: none;

            padding: 16px 22px;

            border-radius: 12px;

            font-family: Georgia, serif;
            font-size: 21px;
            font-weight: bold;

            box-shadow: 0 3px 6px rgba(0,0,0,0.18);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        /* Hide default triangle */

        .member summary::-webkit-details-marker {
            display: none;
        }

        .member summary::after {
            content: "＋";
            float: right;
            font-family: Arial, sans-serif;
            font-size: 20px;
        }

        .member[open] summary::after {
            content: "−";
        }

        .member summary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(0,0,0,0.20);
        }


        /* Main Pombe Lab members */

        .main-member summary {
            background: #5F8069;
            color: white;
        }

        .main-member summary:hover {
            background: #4F6F59;
        }


/* Lab subsection members */

        .subsection-member summary {
           background: #638A96;
            color: white;
        }

        .subsection-member summary:hover {
            background: #527783;
        }


        /* Publications inside member sections */

        .member-publications {
            padding: 20px 10px 5px 10px;
        }


        /* No publications message */

        .no-publications {
            margin: 5px 10px 15px 10px;
            font-style: italic;
            color: #555555;
        }


        /* ---------- BACK BUTTON ---------- */

            display: inline-block;

            color: black;
            text-decoration: none;

            font-weight: bold;
            font-size: 16px;
        }

        .back:hover {
            text-decoration: underline;
        }

/* =====================================================
   CREATE PUBLICATION DISPLAY
   ===================================================== */

function createPublication(publication) {

    const container = document.createElement("article");

    container.className = "publication";

    const link =
        publication.link === "#"
            ? "#"
            : publication.link;

    container.innerHTML = `

        <a
            class="publication-button"
            href="${link}"
            target="_blank"
            rel="noopener noreferrer"
        >
            ${publication.title}
        </a>

        <p class="authors">
            ${publication.authors.join("; ")}
        </p>

        <p class="journal">
            ${publication.journal} · ${publication.year}
        </p>

    `;

    return container;
}

   ===================================================== */

    document.getElementById("all-publications");

publications
    .sort((a, b) => b.year - a.year)
    .forEach(publication => {

        allPublicationsContainer.appendChild(
            createPublication(publication)
        );

    });


/* =====================================================
   PUBLICATIONS BY MEMBER
   ===================================================== */

const membersContainer =
    document.getElementById("members");

members.forEach(member => {

    const details = document.createElement("details");

    details.className =
        member.group === "subsection"
            ? "member subsection-member"
            : "member main-member";


    const summary = document.createElement("summary");

    summary.textContent = member.name;


    const publicationContainer =
        document.createElement("div");

    publicationContainer.className =
        "member-publications";


    const memberPublications =
        publications.filter(publication =>
            publication.members.includes(member.id)
        );


    if (memberPublications.length === 0) {

        publicationContainer.innerHTML = `
            <p class="no-publications">
                No publications yet.
            </p>
        `;

    } else {

        memberPublications
            .sort((a, b) => b.year - a.year)
            .forEach(publication => {

                publicationContainer.appendChild(
                    createPublication(publication)
                );

            });

    }


    details.appendChild(summary);

    details.appendChild(publicationContainer);

    membersContainer.appendChild(details);

});
